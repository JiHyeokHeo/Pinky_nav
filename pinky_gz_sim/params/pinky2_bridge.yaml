# The moving robot. /clock is deliberately bridged only once by pinky1_bridge.
- ros_topic_name: "/pinky2/cmd_vel"
  gz_topic_name: "pinky2/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/pinky2/odom"
  gz_topic_name: "pinky2/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/pinky2/scan"
  gz_topic_name: "pinky2/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/pinky2/joint_states"
  gz_topic_name: "pinky2/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

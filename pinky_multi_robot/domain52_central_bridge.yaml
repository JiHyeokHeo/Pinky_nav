# One bridge process for the production topology:
# Central controller Domain 52, pinky1 Domain 20, pinky2 Domain 22.
# domain_bridge supports topics only. NavigateToPose is relayed by
# pinky_multi_robot nav2_action_proxy instead of this YAML file.
name: domain52_central_bridge
from_domain: 20
to_domain: 52

topics:
  # Live map-to-base TF poses, emitted only with verified localization and scan.
  /tracked_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap: /pinky1/tracked_pose

  /tracked_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 22
    to_domain: 52
    remap: /pinky2/tracked_pose

  # Domain 20 /amcl_pose -> Domain 52 /pinky1/amcl_pose
  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap: /pinky1/amcl_pose

  # Domain 22 /amcl_pose -> Domain 52 /pinky2/amcl_pose
  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 22
    to_domain: 52
    remap: /pinky2/amcl_pose

  # Advisory laser-map match scores (separate from navigation guard READY).
  /localization_alignment:
    type: std_msgs/msg/String
    remap: /pinky1/localization_alignment

  /localization_alignment:
    type: std_msgs/msg/String
    from_domain: 22
    to_domain: 52
    remap: /pinky2/localization_alignment
